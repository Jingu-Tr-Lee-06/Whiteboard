<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Whiteboard</title>
  <link rel="stylesheet" href="style.css" />

  <!-- 외부 핵심 라이브러리 (Fabric.js, Firebase Compat, jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="theme-chalkboard user-mode-student">

  <!-- 상단 상태 바 -->
  <aside id="status-bar" class="status-bar-container">
    <div class="status-indicator">
      <span class="status-dot live"></span>
      <span id="role-text" class="status-label">학생 모드 (읽기 전용)</span>
    </div>
    <div class="session-info">
      <span id="active-user-count" class="user-badge">동시 접속: 1명</span>
      <!-- 학생 전용 PDF 다운로드 버튼 -->
      <button id="btn-student-export-pdf" class="btn-student-pdf" title="현재까지의 판서 내용을 PDF로 저장합니다">PDF 저장</button>
      <!-- 교수자 전환 버튼 (클릭 시 간결한 prompt 입력창 호출) -->
      <button id="btn-open-auth-modal" class="btn-auth-switch" title="교수자 권한으로 전환">교수자 인증</button>
    </div>
  </aside>

  <!-- 교수자 전용 판서 툴바 (인증 전 숨김) -->
  <header id="toolbar" class="toolbar-container" style="display: none;">
    <!-- 1. 도구 선택 (펜, 지우개, 올가미) -->
    <section class="tool-section">
      <button id="btn-tool-pen" class="tool-btn active" data-tool="pen" title="펜 쓰기">
        <span class="label">펜</span>
      </button>
      <button id="btn-tool-eraser" class="tool-btn" data-tool="eraser" title="지우개">
        <span class="label">지우개</span>
      </button>
      <button id="btn-tool-lasso" class="tool-btn" data-tool="lasso" title="올가미 선택 및 이동">
        <span class="label">올가미</span>
      </button>
    </section>

    <div class="toolbar-divider"></div>

    <!-- 2. 펜 색상 선택 영역 -->
    <section id="pen-settings" class="tool-section">
      <div class="preset-color-container">
        <button class="color-preset-btn active" data-color="#FFFFFF" style="background-color: #FFFFFF;" aria-label="흰색"></button>
        <button class="color-preset-btn" data-color="#FFEE58" style="background-color: #FFEE58;" aria-label="노란색"></button>
        <button class="color-preset-btn" data-color="#FF8A80" style="background-color: #FF8A80;" aria-label="분홍색"></button>
        <div class="custom-color-wrapper" title="사용자 지정 색상">
          <input type="color" id="custom-color-picker" value="#FFFFFF" />
        </div>
      </div>
    </section>

    <!-- 3. 지우개 세부 모드 선택 영역 -->
    <section id="eraser-settings" class="tool-section" style="display: none;">
      <div class="toggle-mode-group">
        <button id="btn-erase-stroke" class="mode-btn active" data-erase-mode="stroke">획 지우기</button>
        <button id="btn-erase-area" class="mode-btn" data-erase-mode="area">영역 지우기</button>
      </div>
    </section>

    <div class="toolbar-divider"></div>

    <!-- 4. 브러시 두께 설정 -->
    <section class="tool-section slider-section">
      <span class="slider-caption">두께</span>
      <input type="range" id="size-slider" min="1" max="50" value="4" class="range-slider" />
      <span id="size-display-val" class="slider-indicator">4px</span>
    </section>

    <div class="toolbar-divider"></div>

    <!-- 5. 칠판 배경 테마 선택 -->
    <section class="tool-section">
      <select id="select-board-theme" class="theme-dropdown">
        <option value="chalkboard" selected>초록 칠판</option>
        <option value="whiteboard">화이트보드</option>
        <option value="blackboard">블랙보드</option>
      </select>
    </section>

    <div class="toolbar-divider"></div>

    <!-- 6. 판서 액션 버튼 -->
    <section class="tool-section action-section">
      <button id="btn-action-undo" class="action-btn" title="실행 취소">실행취소</button>
      <button id="btn-action-redo" class="action-btn" title="다시 실행">다시실행</button>
      <button id="btn-action-clear" class="action-btn danger" title="현재 슬라이드 판서 초기화">초기화</button>
      <button id="btn-action-export-pdf" class="action-btn primary" title="전체 슬라이드 PDF 다운로드">PDF 저장</button>
    </section>
  </header>

  <!-- 하단 슬라이드(칠판) 네비게이션 도크 -->
  <footer id="slide-tab-dock" class="slide-dock-container">
    <div id="slide-tabs-scroll" class="slide-tabs-track">
      <div class="slide-tab-item active" data-slide-id="slide_1">
        <span class="tab-label">칠판 1</span>
      </div>
    </div>
    <!-- 슬라이드 추가 버튼 (교수자 인증 시 활성화) -->
    <button id="btn-add-slide" class="btn-add-slide" style="display: none;">+ 칠판 추가</button>
  </footer>

  <!-- 메인 캔버스 영역 -->
  <main id="canvas-container" class="canvas-viewport">
    <canvas id="paint-canvas"></canvas>
  </main>

  <!-- 모듈 스크립트 로드 -->
  <script src="slide_manager.js"></script>
  <script src="tools.js"></script>
  <script src="export_pdf.js"></script>
  <script src="firebase_sync.js"></script>
  <script src="main.js"></script>
</body>
</html>
